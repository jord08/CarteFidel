<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7b2d26">
<title>Carte Fidèle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Mes cartes</h1>
  <button id="menu" type="button" class="icone" aria-label="Sauvegarde">⋮</button>
</header>
<main>
  <input id="recherche" type="search" placeholder="Rechercher une enseigne" aria-label="Rechercher" hidden>
  <p id="vide" hidden>Aucune carte. Appuyez sur + pour en ajouter.</p>
  <div id="grille"></div>
</main>

<button id="ajouter" class="fab" aria-label="Ajouter une carte">+</button>

<dialog id="dlg-ajout">
  <form id="form-ajout" method="dialog">
    <h2>Nouvelle carte</h2>
    <label>Enseigne
      <input id="nom" type="text" required list="enseignes" autocomplete="off" placeholder="Ex : Carrefour"></label>
    <datalist id="enseignes"></datalist>
    <div class="deux">
      <label class="btn-fichier">📷 Appareil photo
        <input id="photo-camera" type="file" accept="image/*" capture="environment" hidden></label>
      <label class="btn-fichier">🖼️ Galerie
        <input id="photo-galerie" type="file" accept="image/*" hidden></label>
    </div>
    <p class="aide">Photographiez le code-barres de la carte, ou choisissez une photo.</p>
    <p id="statut" class="aide" role="status"></p>
    <label>Numéro du code-barres
      <input id="code" type="text" inputmode="text" required placeholder="Détecté automatiquement ou à saisir"></label>
    <div class="logo-ligne">
      <img id="logo-apercu" alt="" hidden>
      <label>Logo de l'enseigne (optionnel)
        <input id="logo" type="file" accept="image/*"></label>
    </div>
    <div class="deux">
      <button type="button" id="annuler" class="secondaire">Annuler</button>
      <button type="submit">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-code">
  <h2 id="code-nom"></h2>
  <canvas id="canvas-code"></canvas>
  <div class="bascule" role="group" aria-label="Type de code">
    <button type="button" id="mode-barres" aria-pressed="true">Code-barres</button>
    <button type="button" id="mode-qr" aria-pressed="false">QR code</button>
  </div>
  <p id="code-num"></p>
  <div class="deux">
    <button type="button" id="supprimer" class="secondaire">Supprimer</button>
    <button type="button" id="fermer">Fermer</button>
  </div>
</dialog>

<dialog id="dlg-menu">
  <h2>Sauvegarde</h2>
  <p class="aide">Vos cartes sont stockées sur ce téléphone. Exportez-les pour les conserver ou les transférer.</p>
  <div class="deux">
    <button type="button" id="exporter">Exporter</button>
    <label class="btn-fichier">Importer
      <input id="importer" type="file" accept="application/json,.json" hidden></label>
  </div>
  <p id="menu-statut" class="aide" role="status"></p>
  <button type="button" id="menu-fermer" class="secondaire">Fermer</button>
</dialog>

<script src="app.js"></script>
</body>
</html>
